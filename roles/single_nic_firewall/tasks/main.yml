---

- name: Install packages
  ansible.builtin.package:
    name: "{{ single_nic_firewall_packages }}"

- name: Copy in VLAN NIC setup script
  ansible.builtin.template:
    src: vlan-nic-setup.j2
    dest: /usr/local/bin/vlan-setup.sh
    owner: root
    group: root
    mode: '0700'

- name: Copy in VLAN NIC systemd service unit file
  ansible.builtin.copy:
    src: vlan-setup.service
    dest: /etc/systemd/system/vlan-setup.service
    owner: root
    group: root
    mode: '0700'
  notify:
    - Reload systemd
  tags: vlan

- name: Start VLAN NIC configure service
  ansible.builtin.systemd:
    name: vlan-setup
    state: started
    enabled: true

- name: Enable DHCP on VLAN NIC
  ansible.builtin.copy:
    src: vlan
    dest: /etc/network/interfaces.d/
    mode: '0644'

- name: Template dnsmasq config
  ansible.builtin.template:
    src: dnsmasq.conf.j2
    dest: /etc/dnsmasq.d/homenet.conf
    owner: root
    group: root
    mode: '0600'
  notify:
    - Restart dnsmasq
  tags: dnsmasq

- name: Enable IP fwd
  ansible.builtin.command:
    cmd: echo 1 > /proc/sys/net/ipv4/ip_forward
  changed_when: single_nic_firewall_command_result.rc == 0
  register: single_nic_firewall_command_result

- name: Enable IP fwd permanently
  ansible.builtin.lineinfile:
    path: /etc/sysctl.d/ip_forward.conf
    line: net.ipv4.ip_forward=1
    owner: root
    group: root
    mode: '0655'
    create: true

- name: Template nftables FW rules
  ansible.builtin.template:
    src: nftables.conf.j2.myown
    dest: /etc/nftables.conf
    owner: root
    group: root
    mode: '0700'
  tags: nftables
  notify:
    - Reload nftables

- name: Enable and start nftables service
  ansible.builtin.systemd:
    name: nftables
    state: started
    enabled: true
