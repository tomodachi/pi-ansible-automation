---

- name: Add Tailscale APT repository GPG key
  ansible.builtin.get_url:
    url: https://pkgs.tailscale.com/stable/{{ ansible_distribution | lower }}/{{ ansible_distribution_release }}.asc
    dest: /etc/apt/trusted.gpg.d/tailscale-com.asc
    mode: '0644'
    force: true

- name: Deduce OS architecture
  ansible.builtin.command: dpkg --print-architecture
  register: tailscale_deb_arch
  changed_when: false

- name: Add Tailscale APT repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ tailscale_deb_arch.stdout }}
      signed-by=/etc/apt/trusted.gpg.d/tailscale-com.asc]
      https://pkgs.tailscale.com/stable/{{ ansible_distribution | lower }} {{ ansible_distribution_release }} main

- name: Install Tailscale packages
  ansible.builtin.apt:
    name: tailscale
    state: present
    update_cache: true
  when: not ansible_check_mode

- name: Start tailscaled
  ansible.builtin.systemd:
    name: tailscaled
    state: started
    enabled: true
  when: not ansible_check_mode

